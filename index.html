<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0a08" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Сушь" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="assets/gen/app_icon_192.png" />
    <link rel="apple-touch-icon" href="assets/gen/app_icon_192.png" />
    <title>Сушь</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d0a08; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #app { width: 100%; height: 100%; height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
      canvas { cursor: none; touch-action: none; }
      /* a phone held upright: ask to turn it (the game is drawn for a wide screen) */
      #turn { display: none; position: fixed; inset: 0; z-index: 20; background: #0d0a08; color: #e6cc97; font: 18px/1.5 'IBM Plex Mono', monospace; text-align: center; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
      #turn b { display: block; font-size: 48px; margin-bottom: 12px; color: #f0a040; }
      @media (orientation: portrait) and (pointer: coarse) { #turn { display: flex; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="turn"><div><b>⟲</b>Поверните телефон горизонтально.<br />Сушь широкая — как пустыня.</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
